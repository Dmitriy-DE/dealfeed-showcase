<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061018"/><stop offset="1" stop-color="#0b1217"/></linearGradient></defs>
<rect width="1600" height="520" rx="26" fill="url(#bg)"/><rect x="1" y="1" width="1598" height="518" rx="25" fill="none" stroke="#1d5266"/>
<text x="48" y="58" fill="#16d9ff" font-family="monospace" font-size="24" font-weight="700">THE BROKER FLOW · WHAT EACH OBJECT MEANS</text>
<text x="48" y="92" fill="#a8bcc8" font-family="Arial" font-size="21">The system keeps source evidence, commercial intent, matching and money/tracking state as separate objects.</text>

<g font-family="Arial">
<g transform="translate(42 135)"><rect width="235" height="305" rx="18" fill="#0a1720" stroke="#55b6ff"/><text x="22" y="40" fill="#55b6ff" font-size="25" font-weight="700">Raw message</text><text x="22" y="78" fill="#f0f4f6" font-size="17">Telegram source post</text><text x="22" y="120" fill="#9fb1bb" font-size="15">Stored verbatim.</text><text x="22" y="148" fill="#9fb1bb" font-size="15">Never rewritten.</text><text x="22" y="190" fill="#66df91" font-size="15" font-weight="700">Purpose:</text><text x="22" y="216" fill="#dfe8ed" font-size="15">audit evidence</text></g>

<g transform="translate(296 135)"><rect width="235" height="305" rx="18" fill="#0a1720" stroke="#2fe3b0"/><text x="22" y="40" fill="#2fe3b0" font-size="25" font-weight="700">Opportunity</text><text x="22" y="78" fill="#f0f4f6" font-size="17">Structured intent</text><text x="22" y="120" fill="#9fb1bb" font-size="15">BUY/SELL traffic or offer</text><text x="22" y="148" fill="#9fb1bb" font-size="15">GEO · source · payout</text><text x="22" y="176" fill="#9fb1bb" font-size="15">missing facts stay null</text><text x="22" y="218" fill="#66df91" font-size="15" font-weight="700">Purpose:</text><text x="22" y="244" fill="#dfe8ed" font-size="15">machine-readable demand/supply</text></g>

<g transform="translate(550 135)"><rect width="235" height="305" rx="18" fill="#0a1720" stroke="#8b5cf6"/><text x="22" y="40" fill="#b89cff" font-size="25" font-weight="700">Match</text><text x="22" y="78" fill="#f0f4f6" font-size="17">Demand ↔ supply pair</text><text x="22" y="120" fill="#9fb1bb" font-size="15">hard filters first</text><text x="22" y="148" fill="#9fb1bb" font-size="15">then relevance score</text><text x="22" y="176" fill="#9fb1bb" font-size="15">fresh/high-quality can alert</text><text x="22" y="218" fill="#66df91" font-size="15" font-weight="700">Purpose:</text><text x="22" y="244" fill="#dfe8ed" font-size="15">candidate commercial connection</text></g>

<g transform="translate(804 135)"><rect width="235" height="305" rx="18" fill="#0a1720" stroke="#ffb547"/><text x="22" y="40" fill="#ffb547" font-size="25" font-weight="700">Deal</text><text x="22" y="78" fill="#f0f4f6" font-size="17">Operator-approved terms</text><text x="22" y="120" fill="#9fb1bb" font-size="15">partner + offer</text><text x="22" y="148" fill="#9fb1bb" font-size="15">payout + fee + model</text><text x="22" y="176" fill="#9fb1bb" font-size="15">explicit lifecycle state</text><text x="22" y="218" fill="#66df91" font-size="15" font-weight="700">Purpose:</text><text x="22" y="244" fill="#dfe8ed" font-size="15">commercial agreement</text></g>

<g transform="translate(1058 135)"><rect width="235" height="305" rx="18" fill="#0a1720" stroke="#ff8a3d"/><text x="22" y="40" fill="#ff8a3d" font-size="25" font-weight="700">Tracker link</text><text x="22" y="78" fill="#f0f4f6" font-size="17">Broker-controlled redirect</text><text x="22" y="120" fill="#9fb1bb" font-size="15">creates click ID</text><text x="22" y="148" fill="#9fb1bb" font-size="15">records click</text><text x="22" y="176" fill="#9fb1bb" font-size="15">302 → advertiser URL</text><text x="22" y="218" fill="#66df91" font-size="15" font-weight="700">Purpose:</text><text x="22" y="244" fill="#dfe8ed" font-size="15">measure traffic independently</text></g>

<g transform="translate(1312 135)"><rect width="246" height="305" rx="18" fill="#0a1720" stroke="#2fe3b0"/><text x="22" y="40" fill="#2fe3b0" font-size="25" font-weight="700">Postback</text><text x="22" y="78" fill="#f0f4f6" font-size="17">Advertiser conversion event</text><text x="22" y="120" fill="#9fb1bb" font-size="15">idempotent ingestion</text><text x="22" y="148" fill="#9fb1bb" font-size="15">advertiser payout</text><text x="22" y="176" fill="#9fb1bb" font-size="15">publisher payout</text><text x="22" y="204" fill="#9fb1bb" font-size="15">margin = difference</text><text x="22" y="246" fill="#66df91" font-size="15" font-weight="700">Purpose:</text><text x="22" y="272" fill="#dfe8ed" font-size="15">close measurement loop</text></g>
</g>
</svg>