<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="345" viewBox="0 0 1600 345"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050c12"/><stop offset=".6" stop-color="#07131b"/><stop offset="1" stop-color="#090f15"/></linearGradient><pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#0d2430"/></pattern></defs><rect width="1600" height="345" rx="28" fill="url(#bg)"/><rect width="1600" height="345" rx="28" fill="url(#grid)" opacity=".3"/><rect x="1" y="1" width="1598" height="343" rx="27" fill="none" stroke="#1d5266"/><text x="36" y="44" fill="#16d9ff" font-family="monospace" font-size="15">› operator_controls</text><text x="260" y="44" fill="#879eaa" font-family="Arial" font-size="12">Automation is bounded by defaults, thresholds and explicit approval.</text>
<g transform="translate(35 88)"><rect width="355" height="160" rx="15" fill="#08141d" stroke="#1d5266"/><rect width="4" height="160" rx="2" fill="#2fe3b0"/><text x="18" y="25" fill="#2fe3b0" font-family="monospace" font-size="9">BACKFILL</text><text x="18" y="51" fill="#f4f8fb" font-family="Arial" font-size="15" font-weight="700">History does not spam</text><text x="18" y="76" fill="#879eaa" font-family="Arial" font-size="10.5">old messages are stored and visible but fresh-only alerts are default</text></g><g transform="translate(406 88)"><rect width="355" height="160" rx="15" fill="#08141d" stroke="#1d5266"/><rect width="4" height="160" rx="2" fill="#8b5cf6"/><text x="18" y="25" fill="#8b5cf6" font-family="monospace" font-size="9">QUALITY THRESHOLD</text><text x="18" y="51" fill="#f4f8fb" font-family="Arial" font-size="15" font-weight="700">Only useful matches ping</text><text x="18" y="76" fill="#879eaa" font-family="Arial" font-size="10.5">hard filters + score gate notifications</text></g><g transform="translate(777 88)"><rect width="355" height="160" rx="15" fill="#08141d" stroke="#1d5266"/><rect width="4" height="160" rx="2" fill="#ffb547"/><text x="18" y="25" fill="#ffb547" font-family="monospace" font-size="9">OUTREACH</text><text x="18" y="51" fill="#f4f8fb" font-family="Arial" font-size="15" font-weight="700">Assisted by default</text><text x="18" y="76" fill="#879eaa" font-family="Arial" font-size="10.5">one-tap queue with hourly/daily limits and cooldowns</text></g><g transform="translate(1148 88)"><rect width="417" height="160" rx="15" fill="#08141d" stroke="#1d5266"/><rect width="4" height="160" rx="2" fill="#ff8a3d"/><text x="18" y="25" fill="#ff8a3d" font-family="monospace" font-size="9">DISTRIBUTION</text><text x="18" y="51" fill="#f4f8fb" font-family="Arial" font-size="15" font-weight="700">Disabled until approved</text><text x="18" y="76" fill="#879eaa" font-family="Arial" font-size="10.5">preview/edit text · allowlist channels · explicit owner approval</text></g></svg>